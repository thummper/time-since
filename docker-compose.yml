# Portainer stack: the app plus a Cloudflare Tunnel. Run exactly one replica.
# Set the variables below in the stack's environment section.
services:
  app:
    # CI builds and pushes this image on every push to main. To roll back, set IMAGE_TAG to an
    # older sha-<commit> tag from the GHCR package page.
    image: ghcr.io/thummper/time-since:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Port 3000 is reachable only on the stack network (cloudflared uses http://app:3000).
    # For LAN testing, uncomment:
    # ports:
    #   - '3000:3000'
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, for example https://time.thummper.net}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    # Host folder for the database and backups. It must exist and be owned by uid 1000.
    volumes:
      - ${DATA_DIR:-/docker/time-since}:/data
    # To keep backups on other storage, mount it here and keep BACKUP_DIR=/data/backups:
    #   - /mnt/backup/time-since:/data/backups

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - app
