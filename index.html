<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Status bar color. The colors match --bg in style.css and THEME_COLORS in src/client/theme.ts. -->
    <meta name="theme-color" content="#f3f1fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Time Since</title>
    <meta
      name="description"
      content="See at a glance how long it has been since each chore was last done, and get told when one is overdue."
    />
    <link rel="canonical" href="https://time-since.app/" />
    <!-- Link previews (Discord, Slack, WhatsApp, and others). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Time Since" />
    <meta property="og:title" content="Time Since" />
    <meta
      property="og:description"
      content="See at a glance how long it has been since each chore was last done, and get told when one is overdue."
    />
    <meta property="og:url" content="https://time-since.app/" />
    <meta property="og:image" content="https://time-since.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the Settings theme before first paint. The key matches src/client/theme.ts.
      try {
        var t = localStorage.getItem('time-since:theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          var c = t === 'dark' ? '#121320' : '#f3f1fa'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = c
          })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
